name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bcf
          POSTGRES_PASSWORD: bcf_password
          POSTGRES_DB: bcf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bcf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 3333
      HOST: 0.0.0.0
      LOG_LEVEL: info
      APP_KEY: insecureTestAppKey0123456789abcdef
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: bcf
      DB_PASSWORD: bcf_password
      DB_DATABASE: bcf_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USERNAME: test
      SMTP_PASSWORD: test
      MAIL_FROM_NAME: BCF
      MAIL_FROM_ADDRESS: noreply@bcf.test
      PCS_SERVICE_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: Run API migrations on the test database
        run: pnpm --filter api exec node ace migration:run --force
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pcs-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/pcs-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
